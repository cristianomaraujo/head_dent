name: DART tests
on:
  push:
    paths: ['app/**', 'knowledge/**', 'evals/**', 'tests/**', 'requirements-dart.txt', 'requirements-dev.txt', '.github/workflows/dart-tests.yml']
  pull_request:
    paths: ['app/**', 'knowledge/**', 'evals/**', 'tests/**', 'requirements-dart.txt', 'requirements-dev.txt', '.github/workflows/dart-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
